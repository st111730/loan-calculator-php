services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calc
      POSTGRES_USER: calc
      POSTGRES_PASSWORD: ${PG_PASSWORD:-calc_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calc -d calc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./server
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: calc
      PGUSER: calc
      PGPASSWORD: ${PG_PASSWORD:-calc_dev_password}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    environment:
      VITE_API_PROXY: http://api:4000
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  web_node_modules:
