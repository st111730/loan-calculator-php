services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calc
      POSTGRES_USER: calc
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calc -d calc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./server
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: calc
      PGUSER: calc
      PGPASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
